<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>论文调研工作台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>调</text></svg>">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/katex/katex.min.css">
</head>
<body>
<div id="login-view" class="login-view">
  <div class="login-panel">
    <div class="brand-row">
      <span class="brand-mark">调</span>
      <span class="brand-name">论文调研工作台</span>
    </div>
    <form id="login-form" class="login-form">
      <label class="field">
        <span>用户名</span>
        <input id="username" name="username" autocomplete="username" required>
      </label>
      <label class="field">
        <span>密码</span>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <div id="login-error" class="login-error" hidden></div>
      <button id="login-btn" class="btn btn-primary" type="submit">
        <i data-lucide="log-in"></i><span>登录</span>
      </button>
    </form>
  </div>
</div>

<div id="chat-view" class="chat-view" hidden>
  <aside class="sidebar">
    <div class="sidebar-head">
      <div class="brand-row">
        <span class="brand-mark">调</span>
        <span class="brand-name">论文调研工作台</span>
        <button id="sidebar-toggle" class="sidebar-toggle" type="button" title="收起/展开会话栏" aria-label="收起或展开会话栏">
          <i data-lucide="panel-left"></i>
        </button>
      </div>
      <button id="new-thread-btn" class="btn btn-primary new-thread-btn" type="button">
        <i data-lucide="plus"></i><span>新对话</span>
      </button>
    </div>
    <nav id="thread-list" class="thread-list" aria-label="历史对话"></nav>
    <div class="sidebar-foot">
      <span id="user-label" class="user-label"></span>
      <button id="logout-btn" class="btn btn-ghost" type="button">
        <i data-lucide="log-out"></i><span>退出</span>
      </button>
    </div>
  </aside>
  <div class="chat-main">
    <button id="sidebar-show" class="sidebar-show" type="button" title="展开会话栏" aria-label="展开会话栏">
      <i data-lucide="panel-left-open"></i>
    </button>
    <main id="messages" class="messages" aria-live="polite"></main>
    <div class="composer-wrap">
      <div class="composer">
        <textarea id="question-input" rows="2" placeholder="输入问题或研究方向"></textarea>
        <button id="send-btn" class="btn btn-primary send-btn" type="button" disabled>
          <i data-lucide="send"></i><span>提问</span>
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="/static/katex/katex.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
