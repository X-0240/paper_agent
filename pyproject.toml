# 代码规范配置（2026-10-03 接入）：ruff 做检查，Black 做排版，行宽 80
# 依据 PEP 8 与 Google Python Style Guide；本地与 CI 锁定同一版本（ruff 0.16.10 / black 24.8.0）
[tool.black]
line-length = 80
target-version = ["py310"]

[tool.ruff]
line-length = 80
target-version = "py310"
# 代码根是 src/：让 ruff 把 src 下的包认成第一方，导入分组判定才稳定
src = ["src"]
exclude = [".git", "__pycache__", ".pytest_cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "N", "UP", "B", "SIM"]
# 有意不卡的六条，理由写在这里；数量与处理计划见 docs/AGENTS.md 的「代码规范」一节
# E501   超长行：中文注释按两列计宽，硬卡 80 会让注释凑字数，代码行已由 Black 保证
# UP031  百分号格式化：脚本大多没有测试覆盖，改输出格式有风险没收益
# N818   异常类名后缀：BudgetExceeded 是既有公开名字，改名会波及调用方
# B008   FastAPI 的 Depends/Query/Body 必须写在默认参数里，属误报
# B905   zip 未加 strict：加上会在长度不一致时抛错，属行为变化，要逐处确认
# SIM115 打开文件未用 with：需要逐处确认句柄生命周期
# SIM117 嵌套 with 合并：要重排整段缩进，纯风格收益，随该文件下次功能改动一并处理（现 2 处，都在 web_search.py）
ignore = ["E501", "UP031", "N818", "B008", "B905", "SIM115", "SIM117"]
