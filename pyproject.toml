# 代码规范配置（2026-10-03 接入）：ruff 做检查，Black 做排版，行宽 80
# 依据 PEP 8 与 Google Python Style Guide；本地与 CI 锁定同一版本（ruff 0.16.10 / black 24.8.0）
[tool.black]
line-length = 80
target-version = ["py310"]

[tool.ruff]
line-length = 80
target-version = "py310"
# 代码根是 src/：让 ruff 把 src 下的包认成第一方，导入分组判定才稳定
src = ["src"]
exclude = [".git", "__pycache__", ".pytest_cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "N", "UP"]
# 有意不卡的三条（2026-10-03 统计）：
# E501 超长行 159 处：中文注释按两列计宽，硬卡 80 会让注释凑字数，代码行已由 Black 保证
# UP031 百分号格式化 24 处：脚本大多没有测试覆盖，逐个确认后再改 f-string
# N818 异常类名后缀：BudgetExceeded 是既有公开名字，改名会波及调用方
ignore = ["E501", "UP031", "N818"]
