name: CI

on: [push, pull_request]

jobs:
  pure-tests:
    runs-on: ubuntu-latest
    #代码在 src/ 下，测试命令要在 src 目录里跑（仓库根上移后加的）
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight deps
        run: pip install requests python-dotenv tenacity pytest httpx fastapi pydantic PyJWT numpy
      - name: Run pure unit tests
        run: python -m pytest tests/test_task_router.py tests/test_agent_react.py tests/test_llm_cost.py tests/test_web_search.py tests/test_evaluation_metrics.py tests/test_dialog_anchor.py tests/test_dialog_e2e.py tests/test_cache_admission.py -q
